# Full target company list (design §16.3), task 20b.
#
# For each company the ATS type + board_token was DETECTED/VERIFIED against the
# real careers URL via detect_ats + the public ATS endpoint. Only boards that
# were confirmed live (a public JSON board returning real postings for the
# correct company) carry a connector type + verified token. Companies whose
# public ATS could not be confirmed are routed to the fallback stub with
# `ats: html` and `enabled: true` so they appear in Source Health as needing a
# connector in a later phase; NO board tokens are fabricated for them.
#
# Priority heuristic (design §16.3): Canadian employers + strong mechanical /
# robotics / automotive / aerospace firms -> high; most others -> medium; any
# routed to the fallback stub -> low until a connector exists. The user can edit.
companies:
