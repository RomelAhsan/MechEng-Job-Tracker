# Manual helper: find public Workday boards and check Workday job links from a
# GitHub runner (some Workday data centers refuse the build sandbox). Writes
# output/discovery.json as an artifact. Read-only: it changes nothing.
#
# mode=probe instead sends one small request to each kind of board to see
# which ones answer GitHub's servers (writes output/runner_probe.json).
name: Discover job boards

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover (find boards), probe (which boards answer GitHub), or apify (Apify filter/cost test)"
        required: false
        default: discover

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx "apify-client>=3"
      - if: inputs.mode == 'probe'
        run: python scripts/runner_probe.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - if: inputs.mode == 'discover' || inputs.mode == ''
        run: python scripts/discover_boards.py
      # Tiny Apify runs (well under $0.01 in total) to see how the Workday
      # Actor handles filtered URLs. Skipped when no APIFY_TOKEN secret is set.
      - if: inputs.mode == 'apify'
        run: python scripts/apify_probe.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery
          path: |
            output/discovery.json
            output/apify_probe.json
            output/runner_probe.json
          if-no-files-found: ignore
