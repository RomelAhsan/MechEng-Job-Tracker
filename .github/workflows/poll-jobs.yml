# Scheduled job poller (emailing currently DISABLED).
#
# Runs on GitHub's servers, so jobs keep updating with nothing running on your
# own computer. Email sending is turned OFF (see the notify step below).
#
# Cadence: every 15 minutes. The repository is PUBLIC, so GitHub Actions
# minutes are unlimited. The concurrency guard below ensures runs never
# overlap even if one takes longer than 15 minutes.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   NOTIFY_EMAIL     your Gmail address (where job alerts are sent)
#   SMTP_USERNAME    the same Gmail address
#   SMTP_PASSWORD    a Gmail App Password (NOT your Google password)
#   USER_PASSWORD    any password you pick for the tracker's own account
# Optional:
#   GEMINI_API_KEY   your Google AI Studio key (starts with AQ.) to enable AI
#
# With no secrets set the run still succeeds: emails are written to an
# "outbox" artifact instead of being sent, so nothing breaks.
name: Poll job boards

on:
  schedule:
    # Every 15 minutes (UTC).
    - cron: "*/15 * * * *"
  # Adds a "Run workflow" button so you can trigger a poll on demand.
  workflow_dispatch:

# Never let two polls overlap: they would fight over the same database.
concurrency:
  group: poll-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Secrets are read here at the job level. The `secrets` context is NOT
    # available in a step-level `if`, so the steps below gate on `env` instead.
    # Absent secrets resolve to empty strings, which puts the notifier into its
    # safe outbox mode rather than failing the run.
    env:
      DATABASE_URL: sqlite:///./jobtracker.db
      SMTP_HOST: ${{ secrets.SMTP_USERNAME && 'smtp.gmail.com' || '' }}
      SMTP_PORT: "587"
      SMTP_USE_TLS: "true"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFY_FROM_EMAIL: ${{ secrets.SMTP_USERNAME }}
      NOTIFY_DEFAULT_TO_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      NOTIFY_OUTBOX_DIR: output/outbox
      # AI is optional. Any non-empty GEMINI_API_KEY turns it on (AI Studio
      # issues "AQ."-prefixed keys; the format is not checked). Blank = off.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional third-party fetcher (free tier) for JS-locked Workday boards.
      # Blank = those companies simply yield no jobs. Usage is hard-capped per
      # day in-app so the free monthly credit is never exceeded.
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      # Consumed by the `create-user` bootstrap step.
      JOBTRACKER_USER_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      JOBTRACKER_USER_PASSWORD: ${{ secrets.USER_PASSWORD }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the application
        run: pip install -e .

      # The database carries the "already seen" history that makes new-job
      # detection (and therefore new-job emails) possible. Restoring the most
      # recent copy means each run only reports genuinely new postings.
      - name: Restore the job database
        uses: actions/cache/restore@v4
        with:
          path: jobtracker.db
          key: jobtracker-db-${{ github.run_id }}
          restore-keys: |
            jobtracker-db-

      # state/ holds the Apify spend ledger and the screening-rules
      # fingerprint; both must persist between runs. Kept in its own cache
      # entry so the database cache above keeps its existing key/version.
      - name: Restore run state
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: jobtracker-state-${{ github.run_id }}
          restore-keys: |
            jobtracker-state-

      # A cache saved from an interrupted/overlapping run can be a half-written,
      # CORRUPT SQLite file ("database disk image is malformed"). Restoring it
      # would make every step fail, and the run would then save the corrupt file
      # straight back -- a self-perpetuating loop. Guard against it: verify the
      # restored DB with PRAGMA integrity_check and, if it is missing or
      # corrupt, delete it so the next step rebuilds a clean one. Losing the
      # "already seen" history only means the next run re-baselines; it does not
      # produce duplicate emails (emailing is off) and self-heals immediately.
      - name: Verify the database is not corrupt
        run: |
          if [ -f jobtracker.db ]; then
            if ! sqlite3 jobtracker.db "PRAGMA integrity_check;" | grep -q '^ok$'; then
              echo "::warning::Restored database is corrupt; starting fresh."
              rm -f jobtracker.db
            else
              echo "Database integrity check passed."
            fi
          else
            echo "No cached database; a fresh one will be created."
          fi

      - name: Apply database migrations
        run: python -m jobtracker init-db

      # Notifications are per-user, so an account must exist for mail to have a
      # recipient. Idempotent: a no-op once the account is there.
      - name: Ensure the notification account exists
        if: env.JOBTRACKER_USER_EMAIL != '' && env.JOBTRACKER_USER_PASSWORD != ''
        run: python -m jobtracker create-user

      - name: Poll every enabled job board
        run: python -m jobtracker run

      # New and changed postings are already screened during the poll. The
      # full re-screen of every stored job only runs when the rules or config
      # changed since the last one (fingerprint kept in state/).
      - name: Screen and score the postings
        run: python -m jobtracker screen --only-if-rules-changed

      # Stage-2 AI judgment over the Stage-1 survivors, throttled for the
      # Gemini free tier. Only effective when GEMINI_API_KEY is set; with no key it
      # prints the "add a key" guidance and no-ops. Runs BEFORE notify so the
      # cached AI verdict is available when the exact-match eligible set (which
      # drives emailing) is computed.
      # Cap the AI work per run so this step ALWAYS finishes and the DB save +
      # site build below still run. On a fresh database there can be hundreds of
      # never-analyzed survivors; at the throttled free-tier pace they cannot
      # all be done in one run, and an unbounded step hit the job timeout and
      # got cancelled (losing the run's progress). --limit analyzes a bounded
      # batch of the still-missing survivors each run and the backlog drains
      # across successive runs (every 15 min); already-analyzed jobs are cached
      # and skipped, so later runs only touch genuinely new postings. A
      # step-level timeout is a final backstop. The daily free-tier quota is
      # handled gracefully in-app (the pass stops cleanly and resumes next run).
      - name: Screen with AI (optional, throttled)
        timeout-minutes: 30
        continue-on-error: true
        run: python -m jobtracker screen-ai --only-missing --limit 150

      # EMAILING IS DISABLED (turned off at the user's request). The collector
      # still polls, screens, and publishes the site every run -- it just does
      # not send any email. To re-enable, uncomment the step below; it only
      # emails users who opted in, and only about jobs in their final eligible
      # "Relevant For Me" set (Stage-1 survivors INTERSECT the AI-eligible gate).
      # - name: Email newly found matches
      #   run: python -m jobtracker notify --since-hours 6

      - name: Build a browsable job list
        run: |
          python -m jobtracker export --format markdown --output output/jobs.md
          python -m jobtracker export --format csv --output output/jobs.csv

      - name: Report source health
        run: python -m jobtracker health

      # Verify the DB is still intact, THEN save it. Only saving a
      # known-good DB (and only when the run's steps succeeded) is what breaks
      # the corruption loop: a half-written/corrupt file is never cached, so a
      # bad run cannot poison every future run. `if: success()` (not always())
      # means an aborted/failed run leaves the previous good cache in place.
      - name: Save the job database
        if: success()
        run: |
          if sqlite3 jobtracker.db "PRAGMA integrity_check;" | grep -q '^ok$'; then
            echo "SAVE_DB=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Database corrupt at save time; not caching it."
            echo "SAVE_DB=0" >> "$GITHUB_ENV"
          fi

      - name: Cache the verified database
        if: success() && env.SAVE_DB == '1'
        uses: actions/cache/save@v4
        with:
          path: jobtracker.db
          key: jobtracker-db-${{ github.run_id }}

      # The Apify spend ledger is always kept (it guards the free credit), but
      # the screening fingerprint only counts if this run's database was saved;
      # otherwise the next run must re-screen everything.
      - name: Forget the screening fingerprint when the DB was not saved
        if: always() && env.SAVE_DB != '1'
        run: rm -f state/screen_fingerprint.txt

      - name: Cache run state
        if: always() && hashFiles('state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: state/
          key: jobtracker-state-${{ github.run_id }}

      # Download this from the run page to read your jobs without any hosting.
      # In outbox mode the rendered emails show up here too.
      - name: Upload the job list and outbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs
          path: output/
          if-no-files-found: ignore
          retention-days: 14
